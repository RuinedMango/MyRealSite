name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "27"
          distribution: "temurin"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew check build --no-daemon
