[versions]
javalin = "7.2.3"
jte = "3.2.4"
slf4j = "2.0.18"
logback = "1.6.2"
junit-jupiter = "5.12.1"
h2 = "2.5.252"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-rendering-jte = { module = "io.javalin:javalin-rendering-jte", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin" }

jte = { module = "gg.jte:jte", version.ref = "jte" }
jte-runtime = { module = "gg.jte:jte-runtime", version.ref = "jte" }

h2 = { module = "com.h2database:h2", version.ref = "h2" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
jte = { id = "gg.jte.gradle", version.ref = "jte" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
